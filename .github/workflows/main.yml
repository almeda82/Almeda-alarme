name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permet de lancer le build manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl Pillow

      - name: Compiler avec PyInstaller
        run: pyinstaller --onefile suivi_trains.py

      - name: Publier l'exe généré
        uses: actions/upload-artifact@v4
        with:
          name: suivi_trains-exe
          path: dist/suivi_trains.exe
